<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Dalki</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#080A0E;color:#E8EAF0;
  font-family:'DM Sans',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:24px;
}
.num{
  font-family:'Syne',sans-serif;font-size:120px;font-weight:800;
  color:#6366F1;letter-spacing:-6px;line-height:1;
  text-shadow:0 0 60px rgba(99,102,241,0.4);
}
h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;margin:16px 0 10px}
p{color:#6B7280;font-size:15px;font-weight:300;margin-bottom:32px}
a{
  display:inline-flex;align-items:center;gap:8px;
  background:#6366F1;color:#fff;padding:12px 24px;
  border-radius:10px;text-decoration:none;font-weight:500;
  transition:0.2s ease;
}
a:hover{background:#818CF8;transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="num">404</div>
  <h1>Page not found</h1>
  <p>This page doesn't exist — but great apps do.</p>
  <a href="/">← Back to Dalki</a>
</body>
</html>
