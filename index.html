<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Dalki — Apps, games, and websites built by a mobile developer. Browse and download.">
<meta property="og:title" content="Dalki — Download Hub">
<meta property="og:description" content="Apps, games, and websites built by Dalki. Browse and download.">
<title>Dalki — Download Hub</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAV -->
<nav class="nav" id="nav">
  <a href="/" class="nav-logo">Dal<span>ki</span></a>
  <div class="nav-right">
    <a href="https://wa.me/2347088832722?text=Hi%20Dalki" target="_blank" rel="noopener" class="nav-contact">Contact</a>
  </div>
</nav>

<!-- HERO -->
<header class="hero">
  <div class="hero-inner">
    <div class="hero-badge">
      <span class="badge-dot"></span>
      Indie developer · Nigeria
    </div>
    <h1 class="hero-title">Everything<br><span class="hero-accent">I've built.</span></h1>
    <p class="hero-sub">Apps, games, and websites — browse, download, and use them freely.</p>
    <div class="hero-stats">
      <div class="stat"><span class="stat-num" id="statTotal">—</span><span class="stat-label">Projects</span></div>
      <div class="stat-line"></div>
      <div class="stat"><span class="stat-num" id="statApps">—</span><span class="stat-label">Apps & Games</span></div>
      <div class="stat-line"></div>
      <div class="stat"><span class="stat-num" id="statSites">—</span><span class="stat-label">Websites</span></div>
    </div>
  </div>
</header>

<!-- FILTER BAR -->
<div class="filter-bar" id="filterBar">
  <div class="filter-inner">
    <button class="filter-tab active" data-filter="all">All</button>
    <button class="filter-tab" data-filter="game">Games</button>
    <button class="filter-tab" data-filter="app">Apps</button>
    <button class="filter-tab" data-filter="website">Websites</button>
  </div>
</div>

<!-- GRID -->
<main class="main">
  <div class="grid" id="grid">
    <div class="grid-loading">
      <div class="spinner"></div>
      <p>Loading…</p>
    </div>
  </div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="empty-icon">📭</div>
    <p>Nothing here yet.</p>
  </div>
</main>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-logo">Dal<span>ki</span></div>
    <p class="footer-copy">© 2026 Dalki. Built with passion in Nigeria.</p>
    <a href="/admin.html" class="footer-admin">Admin</a>
  </div>
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-img-wrap">
      <img class="modal-img" id="modalImg" src="" alt="">
      <div class="modal-img-ph" id="modalImgPh"></div>
    </div>
    <div class="modal-body">
      <div class="modal-cat" id="modalCat"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-desc" id="modalDesc"></p>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
